<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Habit Tracker</h1>
      <p class="today" id="today"></p>
    </header>

    <form class="add-form" id="add-form" autocomplete="off">
      <input
        type="text"
        id="habit-input"
        placeholder="Neue Gewohnheit, z. B. 10 Minuten lesen"
        maxlength="60"
        required
      />
      <button type="submit">Hinzufügen</button>
    </form>

    <p class="empty" id="empty" hidden>Noch keine Gewohnheiten. Füge oben eine hinzu.</p>

    <ul class="habits" id="habits"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
